<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cá Mê Truyện - Sáng Tác & Hệ Thống</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-nav: #1f1f1f;
            --accent-blue: #4db8ff;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        /* THANH ĐIỀU HƯỚNG GIỐNG ẢNH 2 */
        nav {
            background-color: var(--bg-nav);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-content {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 22px;
            color: white;
            min-width: fit-content;
        }

        .logo img {
            width: 35px;
            height: 35px;
            border-radius: 5px;
        }

        .menu-item {
            color: #bbb;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .menu-item:hover { color: var(--accent-blue); }

        /* THANH TÌM KIẾM CẢI TIẾN */
        .search-box {
            display: flex;
            background: #2a2a2a;
            border-radius: 4px;
            flex-grow: 1;
            max-width: 400px;
            margin: 0 20px;
            border: 1px solid #444;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            flex-grow: 1;
            outline: none;
        }

        .search-box button {
            background: #3a8fb7;
            border: none;
            color: white;
            padding: 0 15px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
        }

        /* TÀI KHOẢN */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #ddd;
            cursor: pointer;
            min-width: fit-content;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: #444;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #555;
        }

        /* KHUNG NỘI DUNG */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }

        .welcome-card h2 { margin-top: 0; color: white; }
    </style>
</head>
<body>

<nav>
    <div class="nav-content">
        <a href="#" class="logo">
            <img src="https://img.icons8.com/fluency/48/fish.png" alt="logo">
            CÁ MÊ TRUYỆN
        </a>

        <div class="menu-item">Danh Sách ▾</div>
        <div class="menu-item">Thể Loại ▾</div>

        <div class="search-box">
            <input type="text" placeholder="Nhập tên truyện...">
            <button>Tìm kiếm</button>
        </div>

        <div class="user-profile">
            <span>Bé Sói</span>
            <div class="user-avatar">
                <img src="https://img.icons8.com/color/48/wolf.png" width="32">
            </div>
            <span>▾</span>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="welcome-card">
        <h2>Chào mừng đến với Cá Mê Truyện!</h2>
        <p>Hệ thống lưu trữ đang trong giai đoạn Demo. Bạn có thể tìm kiếm truyện hoặc sáng tác nội dung tại đây.</p>
    </div>
</div>

</body>
</html>
