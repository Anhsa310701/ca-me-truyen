<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cá Mê Truyện - Sáng Tác & Hệ Thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-nav: #1f1f1f;
            --bg-body: #121212;
            --accent-blue: #3a8fb7;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-color);
        }

        /* NAVIGATION BAR */
        nav {
            background-color: var(--bg-nav);
            height: 65px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
        }

        /* FONT CHỮ LOGO MỚI */
        .logo-text {
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
            min-width: fit-content;
            margin-right: 10px;
        }

        /* MENU ITEMS */
        .menu-item {
            position: relative;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
            white-space: nowrap;
            padding: 10px 5px;
        }

        .menu-item:hover { color: white; }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #252525;
            min-width: 180px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .menu-item:hover .dropdown { display: block; }

        .dropdown a {
            display: block;
            padding: 12px 15px;
            color: #ddd;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #333;
        }

        .dropdown a:hover { background: #333; color: var(--accent-blue); }

        /* SEARCH BOX */
        .search-box {
            display: flex;
            flex-grow: 1;
            max-width: 350px;
            background: #2a2a2a;
            border-radius: 20px; /* Làm ô tìm kiếm bo tròn hơn */
            border: 1px solid #444;
            margin: 0 15px;
            overflow: hidden;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 15px;
            flex-grow: 1;
            outline: none;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: #888;
            padding: 0 15px;
            cursor: pointer;
            font-size: 18px;
        }

        /* AUTH & SETTINGS */
        .right-area {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: fit-content;
        }

        .auth-links {
            font-size: 14px;
            color: #bbb;
            text-decoration: none;
            transition: 0.3s;
        }

        .auth-links:hover { color: white; }

        .settings-icon {
            font-size: 20px;
            cursor: pointer;
            color: #888;
            transition: 0.3s;
        }

        .settings-icon:hover { 
            color: white; 
            transform: rotate(45deg); 
        }

        /* MAIN */
        .main-content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            border-top: 3px solid var(--accent-blue);
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo-text">CÁ MÊ TRUYỆN</a>

        <div class="menu-item">
            Danh Sách ▾
            <div class="dropdown">
                <a href="#">🔍 Tìm kiếm nâng cao</a>
                <a href="#">🏆 Bảng xếp hạng</a>
                <a href="#">✍️ Truyện sáng tác</a>
            </div>
        </div>

        <div class="menu-item">
            Thể Loại ▾
            <div class="dropdown">
                <a href="#">🌀 Isekai</a>
                <a href="#">⚙️ Hệ thống</a>
                <a href="#">⚡ Dị năng</a>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm truyện...">
            <button>🔍</button>
        </div>

        <div class="right-area">
            <a href="#" class="auth-links">Đăng nhập</a>
            <span style="color: #444;">|</span>
            <a href="#" class="auth-links">Đăng ký</a>
            <div class="settings-icon" title="Cài đặt">⚙️</div>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="card">
        <h2>Chào mừng bạn quay lại!</h2>
        <p>Giao diện demo đã được cập nhật: Xóa logo, đổi font chữ tiêu đề và thêm nút Đăng nhập/Đăng ký.</p>
    </div>
</div>

</body>
</html>
