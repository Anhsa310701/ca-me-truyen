<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cá Mê Truyện - Sáng Tác & Hệ Thống</title>
    <style>
        :root {
            --bg-nav: #1f1f1f;
            --bg-body: #121212;
            --accent-blue: #3a8fb7;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-color);
        }

        /* HEADER & NAVIGATION */
        nav {
            background-color: var(--bg-nav);
            height: 60px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
            min-width: fit-content;
        }

        .logo img { width: 32px; height: 32px; border-radius: 4px; }

        /* DROPDOWN MENU */
        .menu-item {
            position: relative;
            cursor: pointer;
            font-size: 14px;
            color: #bbb;
            white-space: nowrap;
        }

        .menu-item:hover { color: var(--accent-blue); }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #252525;
            min-width: 180px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-top: 10px;
        }

        .menu-item:hover .dropdown { display: block; }

        .dropdown a {
            display: block;
            padding: 12px 15px;
            color: #ddd;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #333;
        }

        .dropdown a:hover { background: #333; color: white; }

        /* SEARCH BOX */
        .search-box {
            display: flex;
            flex-grow: 1;
            max-width: 450px;
            background: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #444;
            margin: 0 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            flex-grow: 1;
            outline: none;
        }

        .search-box button {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 0 15px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
        }

        /* USER AREA */
        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            min-width: fit-content;
        }

        .avatar {
            width: 30px;
            height: 30px;
            background: #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* CONTENT */
        .main-content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-blue);
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo">
            <img src="https://img.icons8.com/fluency/48/fish.png" alt="logo">
            CÁ MÊ TRUYỆN
        </a>

        <div class="menu-item">
            Danh Sách ▾
            <div class="dropdown">
                <a href="#">🔍 Tìm kiếm nâng cao</a>
                <a href="#">🏆 Bảng xếp hạng</a>
                <a href="#">✍️ Truyện sáng tác</a>
            </div>
        </div>

        <div class="menu-item">
            Thể Loại ▾
            <div class="dropdown">
                <a href="#">🌀 Isekai</a>
                <a href="#">⚙️ Hệ thống</a>
                <a href="#">⚡ Dị năng</a>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Nhập tên truyện...">
            <button>Tìm kiếm</button>
        </div>

        <div class="user-area">
            <span>Bé Sói</span>
            <div class="avatar">👤</div>
            <span>▾</span>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="card">
        <h2 style="margin-top:0">Chào mừng bạn đến với Cá Mê Truyện!</h2>
        <p>Giao diện Demo đã được cập nhật theo yêu cầu của bạn. Bây giờ web đã có thanh menu tối (Dark mode) và icon con cá rất xinh.</p>
    </div>
</div>

</body>
</html>
